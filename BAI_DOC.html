<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Đọc Hiểu Tiếng Anh Lớp 6</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1, h2, h3 { color: #2c3e50; }
        h1 { text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .tabs { display: flex; border-bottom: 2px solid #3498db; margin-bottom: 25px; }
        .tab-btn { padding: 12px 20px; cursor: pointer; border: none; background: #eef2f5; font-size: 16px; font-weight: bold; color: #555; transition: 0.3s; border-radius: 8px 8px 0 0; margin-right: 5px; flex-grow: 1; }
        .tab-btn:hover { background: #d5e1e8; }
        .tab-btn.active { background: #3498db; color: #fff; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .passage { background: #eef7fa; padding: 15px 20px; border-left: 5px solid #3498db; margin-bottom: 20px; border-radius: 5px; font-size: 15.5px; }
        .question { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px dashed #ddd; }
        .question:last-child { border-bottom: none; }
        .options label { display: block; margin-bottom: 8px; cursor: pointer; }
        
        .btn { padding: 8px 16px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #27ae60; }
        .btn-submit { background: #e74c3c; font-size: 18px; padding: 12px 30px; display: block; margin: 30px auto; }
        .btn-submit:hover { background: #c0392b; }
